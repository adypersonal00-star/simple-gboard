name: Build Boot Show Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'boot-show-source-v4.zip'
      - '.github/workflows/boot-show.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Extract Boot Show project
        run: python3 -c "import zipfile; zipfile.ZipFile('boot-show-source-v4.zip').extractall('project')"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare stable signing key
        env:
          KEYSTORE_B64: ${{ secrets.BOOT_SHOW_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > project/boot-show-release.p12
      - name: Build signed release APK
        working-directory: project
        env:
          BOOT_SHOW_KEYSTORE_PASSWORD: ${{ secrets.BOOT_SHOW_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Boot-Show-stable-v4
          path: project/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
